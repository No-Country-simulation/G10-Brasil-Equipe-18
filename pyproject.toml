[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "communitylab"
version = "1.0.0"
description = "Detector Inteligente de Histórias de Sucesso e Testemunhos com IA"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "jsonschema>=4.0.0",
    "oci>=2.100",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31",
    "spacy>=3.8,<3.9",
    "pt_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl",
    "streamlit>=1.37",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.uv]
package = false

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["*.json"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.pyright]
extraPaths = [".", "src"]
